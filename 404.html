<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 芯片引脚参考</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" data-root="assets/favicon.svg">
<style>
/* 404 页自包含样式：不依赖外部 CSS，任何深度的错误路径都能正常显示 */
:root{
  --bg:#f7f6f2; --surface:#fffefb; --line:#e5e1d8;
  --txt:#3f3d38; --txt-strong:#26241f; --muted:#55524a;
  --accent:#5c6672; --accent-ink:#434b55;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:var(--sans); font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.wrap{width:min(1180px,100% - 40px); margin:0 auto}
.topbar{border-bottom:1px solid var(--line); background:var(--surface)}
.topbar-inner{display:flex; align-items:center; gap:20px; min-height:58px}
.brand{display:flex; align-items:center; gap:9px; color:var(--txt-strong); text-decoration:none; font-weight:600}
.brand svg{color:var(--accent)}
.topnav{margin-left:auto; display:flex; gap:18px}
.topnav a{color:var(--muted); text-decoration:none; font-size:14px}
.topnav a:hover{color:var(--accent-ink)}
.hero{padding:72px 0 48px; max-width:640px}
.eyebrow{
  display:inline-block; font-size:11.5px; letter-spacing:.14em; font-weight:600;
  color:var(--muted); text-transform:uppercase; margin-bottom:14px;
}
.hero h1{font-size:38px; line-height:1.25; margin:0 0 16px; color:var(--txt-strong); font-weight:650}
.hero h1 em{font-style:normal; color:var(--accent-ink)}
.lede{margin:0 0 28px; color:var(--muted); font-size:16px}
.hero-actions{display:flex; flex-wrap:wrap; gap:12px}
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:10px 18px;
  border:1px solid var(--line); border-radius:10px; background:var(--surface);
  color:var(--txt-strong); text-decoration:none; font-size:14px; font-weight:550;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translateY(-1px); box-shadow:0 2px 10px rgba(48,44,36,.08)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fbfaf7}
.btn-primary:hover{background:var(--accent-ink); border-color:var(--accent-ink)}
.note-grid{
  display:grid; gap:16px; padding-bottom:64px;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); max-width:820px;
}
.note-card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:20px 22px;
}
.note-card h4{margin:0 0 8px; font-size:14px; color:var(--txt-strong)}
.note-card p{margin:0; font-size:14px; color:var(--muted)}
.note-card a{color:var(--accent-ink)}
.footer{border-top:1px solid var(--line); background:var(--surface); padding:22px 0}
.foot-row{display:flex; justify-content:space-between; gap:16px; font-size:13px; color:var(--muted)}
@media (max-width:640px){
  .hero{padding:48px 0 36px}
  .hero h1{font-size:30px}
  .foot-row{flex-direction:column; gap:6px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="index.html" data-root="index.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="6" y="6" width="12" height="12" rx="2"/>
        <path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>
      </svg>
      <span class="brand-txt">芯片引脚参考</span>
    </a>
    <nav class="topnav" aria-label="主导航">
      <a href="index.html" data-root="index.html">芯片系列</a>
      <a href="guide.html" data-root="guide.html">使用说明</a>
    </nav>
  </div>
</header>

<main>
  <section class="wrap hero">
    <span class="eyebrow">404 · Not Found</span>
    <h1>这个页面<br><em>没有找到</em></h1>
    <p class="lede">
      链接可能写错了，或者这颗芯片还没收录。回到芯片系列页重新进入即可；想新增一颗芯片，可以看站内使用说明。
    </p>
    <div class="hero-actions">
      <a class="btn btn-primary" href="index.html" data-root="index.html">
        回到芯片系列
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v13M5 12l7 7 7-7"/>
        </svg>
      </a>
      <a class="btn" href="guide.html" data-root="guide.html">查看使用说明</a>
    </div>
  </section>

  <section class="wrap">
    <div class="note-grid">
      <div class="note-card">
        <h4>想找某颗芯片？</h4>
        <p>从 <a href="index.html" data-root="index.html">芯片系列</a> 进入对应系列，系列页会列出已收录的全部型号，点进去就是封装引脚图与功能总表。</p>
      </div>
      <div class="note-card">
        <h4>想加一颗芯片？</h4>
        <p>每颗芯片都是一份独立的数据文件，按 <a href="guide.html" data-root="guide.html">使用说明</a> 里的步骤新增即可，不需要改任何 JS 或 CSS。</p>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap foot-row">
    <span>芯片引脚参考</span>
    <span>引脚数据以官方数据手册为准，仅供设计参考</span>
  </div>
</footer>

<script>
/* GitHub Pages 会把本站部署在 /<仓库名>/ 这样的子路径下，
   404 页被服务时 URL 深度不确定（可能是 /repo/stm32/xxx），
   所以这里从深到浅探测一次真正的站点根目录，再把页内链接改成从根目录出发的路径。
   探测标记用 assets/favicon.svg —— 它只存在于站点根，不会像 index.html
   那样在 stm32/、esp32/ 子目录里也存在而误判。探测失败时保留相对链接，页面照常可用。 */
(function () {
  var MARKER = 'assets/favicon.svg';
  var segs = location.pathname.split('/').filter(Boolean);
  var candidates = [];
  for (var i = segs.length; i >= 0; i--) {
    var prefix = '/' + segs.slice(0, i).join('/');
    if (prefix !== '/') prefix += '/';
    candidates.push(prefix);
  }

  function apply(base) {
    var nodes = document.querySelectorAll('[data-root]');
    for (var k = 0; k < nodes.length; k++) {
      nodes[k].setAttribute('href', base + nodes[k].getAttribute('data-root'));
    }
  }

  function probe(index) {
    if (index >= candidates.length) return;
    var base = candidates[index];
    try {
      fetch(base + MARKER, { method: 'HEAD' })
        .then(function (res) { res.ok ? apply(base) : probe(index + 1); })
        .catch(function () { probe(index + 1); });
    } catch (e) { /* 老浏览器或 file:// 下直接放弃，保留相对链接 */ }
  }

  probe(0);
})();
</script>
</body>
</html>
